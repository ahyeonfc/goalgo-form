# 시험 → 형식 검사 → 빌드. main 이면 GitHub Pages 에 배포
# 저장소 Pages 설정이 아직 "브랜치에서 배포"라 push 마다 GitHub 의 옛 방식 배포(원본 파일 그대로)도 같이 돈다.
# 설정을 안 바꿔도 되게, 옛 방식 배포가 끝난 뒤(2분 기다림) 빌드한 결과로 다시 덮어쓴다.
# (설정을 Source = "GitHub Actions" 로 바꾸면 기다림 단계는 지워도 됨)
name: 시험·빌드·배포
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 엔진 시험
        run: npm test
      - name: 형식 검사 + 빌드
        run: npm run build
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - name: 옛 방식 Pages 배포가 끝날 때까지 기다리기
        run: sleep 120
      - id: d
        uses: actions/deploy-pages@v4
