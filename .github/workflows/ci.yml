# 시험 → 형식 검사 → 빌드. main 이면 GitHub Pages 에 배포
# (처음 한 번: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔야 배포됨)
name: 시험·빌드·배포
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 엔진 시험
        run: npm test
      - name: 형식 검사 + 빌드
        run: npm run build
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
